services:
  - type: web
    name: salescrm-api
    env: node
    region: singapore          # Closest to India
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false            # Paste from Supabase Dashboard → Database → URI
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a strong secret
      - key: CORS_ORIGIN
        sync: false            # Set to your Vercel URL e.g. https://salescrm.vercel.app
      - key: ADMIN_EMAIL
        sync: false            # Your production admin email
      - key: ADMIN_PASSWORD
        sync: false            # Your production admin password
